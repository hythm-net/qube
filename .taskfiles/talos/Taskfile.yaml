---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  NODES:
    sh: talosctl config info --output json | jq --join-output '[.nodes[]] | join(",")'
  RANDOM_CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1
  PROJECT_ID: 8cfc9211-d42e-45af-a73f-1e52d95c417b
  TALOS_SECRET_ID: 5d74df36-943a-4214-be04-22e23a74e781

tasks:

  generate-talosconfig:
    desc: Generate talos/talosconfig from the Bitwarden secrets bundle [BWS_ACCESS_TOKEN=required]
    cmd: |-
      BUNDLE="$(mktemp)"; trap 'rm -f "$BUNDLE"' EXIT
      # Bitwarden stores the raw base64 values (some with stray whitespace); rebuild the `talosctl gen secrets` shape
      bws --access-token {{ .BWS_ACCESS_TOKEN }} secret get {{ .TALOS_SECRET_ID }} | jq -r '.value' \
        | jq -r 'map_values(gsub("^\\s+|\\s+$";"")) | {
            cluster: {id: .CLUSTER_ID, secret: .CLUSTER_SECRET},
            secrets: {bootstraptoken: .CLUSTER_TOKEN, secretboxencryptionsecret: .CLUSTER_SECRETBOXENCRYPTIONSECRET},
            trustdinfo: {token: .MACHINE_TOKEN},
            certs: {
              etcd: {crt: .CLUSTER_ETCD_CA_CRT, key: .CLUSTER_ETCD_CA_KEY},
              k8s: {crt: .CLUSTER_CA_CRT, key: .CLUSTER_CA_KEY},
              k8saggregator: {crt: .CLUSTER_AGGREGATORCA_CRT, key: .CLUSTER_AGGREGATORCA_KEY},
              k8sserviceaccount: {key: .CLUSTER_SERVICEACCOUNT_KEY},
              os: {crt: .MACHINE_CA_CRT, key: .MACHINE_CA_KEY}}}' > "$BUNDLE"
      talosctl gen config --with-secrets "$BUNDLE" --output-types talosconfig --output {{.TALOS_DIR}}/talosconfig --force \
        kube https://kube.internal:6443
      talosctl config endpoint {{.NODE_NAMES}}
      talosctl config node {{.NODE_NAMES}}
      chmod 600 {{.TALOS_DIR}}/talosconfig
      talosctl config info
    vars:
      NODE_NAMES:
        sh: ls {{.TALOS_DIR}}/nodes/*.yaml.j2 | xargs -n1 basename | sed 's/\.yaml\.j2$//' | tr '\n' ' '
    requires:
      vars: [BWS_ACCESS_TOKEN]
    preconditions:
      - bws --access-token {{ .BWS_ACCESS_TOKEN }} project get {{.PROJECT_ID}}
      - which bws jq talosctl

  renew-talosconfig:
    desc: Issue a longer-lived admin cert through a running node (the generated one lasts 1 year) [TTL={{.TTL}}]
    cmd: |-
      talosctl --nodes {{.RANDOM_CONTROLLER}} config new --crt-ttl {{.TTL}} --roles os:admin {{.TALOS_DIR}}/talosconfig.new
      talosctl --talosconfig {{.TALOS_DIR}}/talosconfig.new config endpoint {{.NODE_NAMES}}
      talosctl --talosconfig {{.TALOS_DIR}}/talosconfig.new config node {{.NODE_NAMES}}
      mv {{.TALOS_DIR}}/talosconfig.new {{.TALOS_DIR}}/talosconfig && chmod 600 {{.TALOS_DIR}}/talosconfig
      talosctl config info
    vars:
      TTL: '{{.TTL | default "43800h"}}'
      NODE_NAMES:
        sh: ls {{.TALOS_DIR}}/nodes/*.yaml.j2 | xargs -n1 basename | sed 's/\.yaml\.j2$//' | tr '\n' ' '
    preconditions:
      - talosctl config info
      - which talosctl

  render-config:
    desc: Render Talos config for a node [BWS_ACCESS_TOKEN=required] [NODE=required]
    cmd: |-
      SECRETS="$(mktemp)"; trap 'rm -f "$SECRETS"' EXIT
      bws --access-token {{ .BWS_ACCESS_TOKEN }} secret get {{ .TALOS_SECRET_ID }} | jq -r '.value' > "$SECRETS"
      TYPE="$(minijinja-cli {{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2 | yq -r -e 'select(.machine) | .machine.type')"
      talosctl machineconfig patch <(minijinja-cli {{.TALOS_DIR}}/cluster.yaml.j2 "$SECRETS" --format json) \
        -p @<(minijinja-cli {{.TALOS_DIR}}/networking.yaml.j2) \
        -p @<(minijinja-cli {{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2) \
        -p @<(minijinja-cli {{.TALOS_DIR}}/${TYPE}.yaml.j2 "$SECRETS" --format json)
    env:
      SCHEMATIC:
        sh: task --silent talos:generate-schematic
    requires:
      vars: [BWS_ACCESS_TOKEN, NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/cluster.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml.j2
      - test -f {{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2
      - bws --access-token {{ .BWS_ACCESS_TOKEN }} project get {{.PROJECT_ID}}
      - which bws jq minijinja-cli talosctl yq

  apply-node:
    desc: Apply Talos config to a node [BWS_ACCESS_TOKEN=required] [NODE=required] [MODE={{.MODE}}] [INSECURE=]
    cmd: |-
      task --silent talos:render-config BWS_ACCESS_TOKEN={{.BWS_ACCESS_TOKEN}} NODE={{.NODE}} \
        | talosctl --nodes {{.NODE}} apply-config --mode {{.MODE}} --file /dev/stdin {{if .INSECURE}}--insecure{{end}} {{.CLI_ARGS}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      INSECURE:
        sh: talosctl version --nodes {{.NODE}} &> /dev/null || echo true
    requires:
      vars: [BWS_ACCESS_TOKEN, NODE]
    preconditions:
      - talosctl config info
      - which talosctl

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    prompt: Upgrade Talos node '{{.NODE}}' to {{.TALOS_IMAGE}} ... continue?
    # --drain=false: talosctl's drain cordons through the Kubernetes API and only this process
    # uncordons, after the reboot, giving up on the first non-retryable API error from the
    # fresh control plane. On one node there is nowhere to drain to, and Talos stops the pods
    # gracefully itself.
    cmd: talosctl --nodes {{.NODE}} upgrade --image={{.TALOS_IMAGE}} --reboot-mode=powercycle --drain=false --timeout=10m
    vars:
      # version comes from the installer pin in cluster.yaml.j2 (Renovate keeps it and tuppr in sync)
      TALOS_VERSION:
        sh: grep -oE 'metal-installer/[^:]+:(v[0-9.]+)' {{.TALOS_DIR}}/cluster.yaml.j2 | sed 's/.*://'
      SCHEMATIC:
        sh: task --silent talos:generate-schematic
      TALOS_IMAGE: factory.talos.dev/metal-installer/{{.SCHEMATIC}}:{{.TALOS_VERSION}}
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which grep sed talosctl

  upgrade-k8s:
    desc: Upgrade Kubernetes on the cluster [VERSION=required]
    prompt: Upgrade Kubernetes to {{.VERSION}} ... continue?
    cmd: talosctl --nodes {{.RANDOM_CONTROLLER}} upgrade-k8s --to {{.VERSION}}
    requires:
      vars: [VERSION]
    preconditions:
      - talosctl config info
      - which talosctl

  reboot-node:
    desc: Reboot Talos on a single node [NODE=required] [MODE={{.MODE}}]
    cmd: talosctl --nodes {{.NODE}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  shutdown-node:
    desc: Shutdown Talos on a single node [NODE=required]
    prompt: Shutdown Talos node '{{.NODE}}' ... continue?
    cmd: talosctl --nodes {{.NODE}} shutdown --force
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - which talosctl

  shutdown-cluster:
    desc: Shutdown Talos across the whole cluster
    prompt: Shutdown the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} shutdown --force
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  reset-node:
    desc: Reset Talos on a single node [NODE=required]
    prompt: Reset Talos node '{{.NODE}}' ... continue?
    cmd: talosctl --nodes {{.NODE}} reset --reboot=true --graceful=false
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  reset-cluster:
    desc: Reset Talos across the whole cluster
    prompt: Reset the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} reset --reboot=true --graceful=false
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  generate-kubeconfig:
    desc: Generate the kubeconfig for a Talos cluster
    cmd: talosctl kubeconfig --nodes {{.RANDOM_CONTROLLER}} --force {{.KUBERNETES_DIR}}
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq talosctl

  generate-iso:
    desc: Generate a Talos ISO for a specific version [VERSION=required]
    cmd: |-
      curl -L -o {{.TALOS_DIR}}/talos-{{.VERSION}}.iso \
        https://factory.talos.dev/image/{{.SCHEMATIC}}/{{.VERSION}}/metal-amd64.iso
    vars:
      SCHEMATIC:
        sh: task --silent talos:generate-schematic
    requires:
      vars: [VERSION]
    preconditions:
      - which curl task

  generate-schematic:
    desc: Generate a Talos schematic
    cmd: |-
      minijinja-cli {{.TALOS_DIR}}/schematic.yaml.j2 \
        | curl --silent -X POST --data-binary @- https://factory.talos.dev/schematics \
        | jq --raw-output '.id'
    env:
      CONFIG_EARLY:
        sh: minijinja-cli {{.TALOS_DIR}}/networking.yaml.j2 | zstd --compress --ultra -22 | base64 -w0
    preconditions:
      - test -f {{.TALOS_DIR}}/schematic.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml.j2
      - which base64 curl jq minijinja-cli zstd
