---
version: '3'

vars:
  RANDOM_CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1

tasks:

  cluster:
    desc: Bootstrap the cluster end to end (nodes -> talos -> apps) [BWS_ACCESS_TOKEN=required]
    prompt: Bootstrap the whole cluster ...?
    cmds:
      - task: nodes
        vars: {BWS_ACCESS_TOKEN: '{{.BWS_ACCESS_TOKEN}}'}
      - task: talos
      - task: apps
        vars: {BWS_ACCESS_TOKEN: '{{.BWS_ACCESS_TOKEN}}'}
    requires:
      vars: [BWS_ACCESS_TOKEN]

  nodes:
    desc: Apply Talos config to every node that is still in maintenance mode [BWS_ACCESS_TOKEN=required]
    cmd: |-
      for node in {{.NODES}}; do
        if out="$(task --silent talos:apply-node BWS_ACCESS_TOKEN={{.BWS_ACCESS_TOKEN}} NODE="$node" INSECURE=true 2>&1)"; then
          echo "applied config to $node"
        elif [[ "$out" == *"certificate required"* ]]; then
          echo "$node already configured, skipping"
        else
          echo "$out"; exit 1
        fi
      done
    vars:
      NODES:
        sh: talosctl config info --output json | jq --raw-output '.nodes | join(" ")'
    requires:
      vars: [BWS_ACCESS_TOKEN]
    preconditions:
      - talosctl config info
      - which jq talosctl

  talos:
    desc: Bootstrap Talos (idempotent; retries until etcd reports AlreadyExists)
    prompt: Bootstrap Talos ...?
    cmds:
      - |-
        until out="$(talosctl --nodes {{.RANDOM_CONTROLLER}} bootstrap 2>&1 || true)" && [[ "$out" == *"AlreadyExists"* ]]; do
          echo "bootstrap in progress, retrying in 5s..."; sleep 5
        done
      - talosctl --nodes {{.RANDOM_CONTROLLER}} kubeconfig --force {{.KUBERNETES_DIR}}
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq talosctl

  apps:
    desc: Bootstrap Kubernetes Apps  [BWS_ACCESS_TOKEN=required]
    prompt: Bootstrap Kubernetes Apps ...?
    cmds:
      - kubectl config set-cluster {{.CONTEXT}} --server https://{{.RANDOM_CONTROLLER}}:6443
      - defer: talosctl --nodes {{.RANDOM_CONTROLLER}} kubeconfig --force {{.KUBERNETES_DIR}}
      # nodes only turn Ready=True once the CNI is up; on a healthy cluster skip the wait entirely
      - |-
        kubectl wait nodes --for=condition=Ready=True --all --timeout=10s &>/dev/null \
          || until kubectl wait nodes --for=condition=Ready=False --all --timeout=10s &>/dev/null; do echo "waiting for nodes..."; sleep 5; done
      - task: kustomize
        vars: {BWS_ACCESS_TOKEN: '{{.BWS_ACCESS_TOKEN}}'}
      - task: helmfile
    vars:
      # the kubeconfig's cluster entry (named after the Talos cluster), NOT the talosconfig context
      CONTEXT:
        sh: kubectl config view --output jsonpath='{.clusters[0].name}'
    requires:
      vars: [BWS_ACCESS_TOKEN]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq kubectl bws talosctl

  kustomize:
    internal: true
    desc: Apply kustomize [BWS_ACCESS_TOKEN=required]
    cmd: |-
      kustomize build {{.BOOTSTRAP_DIR}}/kustomize/apps | minijinja-cli - | kubectl apply --server-side --force-conflicts -f -
    env:
      # the templates read ENV.*; the token is a Task var, so export it here explicitly
      BWS_ACCESS_TOKEN: '{{.BWS_ACCESS_TOKEN}}'
      BOT_APP_ID:
        sh: bws --access-token {{.BWS_ACCESS_TOKEN}} secret get {{.BOT_SECRET_ID}} | jq -r '.value | fromjson .BOT_APP_ID'
      BOT_APP_PRIVATE_KEY:
        sh: bws --access-token {{.BWS_ACCESS_TOKEN}} secret get {{.BOT_SECRET_ID}} | jq -r '.value | fromjson .BOT_APP_PRIVATE_KEY'
      BOT_APP_INSTALLATION_ID:
        sh: bws --access-token {{.BWS_ACCESS_TOKEN}} secret get {{.BOT_SECRET_ID}} | jq -r '.value | fromjson .BOT_APP_INSTALLATION_ID'
    vars:
      BOT_SECRET_ID: e6c289ae-74e8-4f5a-812e-b4f000bc302e
    requires:
      vars: [BWS_ACCESS_TOKEN]
    preconditions:
      - test -d {{.BOOTSTRAP_DIR}}/kustomize/apps
      - bws --access-token {{.BWS_ACCESS_TOKEN}} project get 8cfc9211-d42e-45af-a73f-1e52d95c417b
      - which bws minijinja-cli kubectl

  helmfile:
    internal: true
    cmds:
      - |
        helmfile --file {{.BOOTSTRAP_DIR}}/helmfile/crds.yaml template --quiet \
          | yq ea -e 'select(.kind == "CustomResourceDefinition")' \
          | kubectl apply --server-side --field-manager bootstrap --force-conflicts --filename -
      - helmfile --file {{.BOOTSTRAP_DIR}}/helmfile/apps.yaml sync --hide-notes
    preconditions:
      - test -f {{.BOOTSTRAP_DIR}}/helmfile/crds.yaml
      - test -f {{.BOOTSTRAP_DIR}}/helmfile/apps.yaml
      - which helmfile kubectl yq
