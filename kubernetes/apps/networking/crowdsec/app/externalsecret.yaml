---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: crowdsec-secret
    template:
      data:
        # LAPI registers the envoy bouncer under this key on start; the bouncer presents it
        BOUNCER_KEY_ENVOY: "{{ .CROWDSEC_BOUNCER_KEY }}"
  dataFrom:
    - extract:
        key: crowdsec
