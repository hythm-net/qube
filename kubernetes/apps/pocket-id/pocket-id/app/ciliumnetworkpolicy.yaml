---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Pocket ID faces the internet through envoy-direct; the apps' own calls to it (token exchange,
# user info) come in the same way, via id.hythm.net.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pocket-id
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-direct
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    # the kubelet's probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "1411"
              protocol: TCP
    # CoreDNS's answers come back from the DNS service's address (see immich-server's policy)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
