---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: paperless-secret
    template:
      data:
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_DBPASS: "{{ .POSTGRES_PASSWORD }}"
        # created on first start only; the password lives in Bitwarden (qube/paperless)
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        # sign-in with Pocket ID (client "paperless"; only the family group may use it)
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect": {"SCOPE": ["openid", "profile", "email"], "OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "pocket-id", "name": "Pocket ID", "client_id": "paperless", "secret": "{{ .PAPERLESS_CLIENT_SECRET }}", "settings": {"server_url": "https://id.hythm.net"}}]}}
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: pocket-id
