---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neony-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: neony-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # the image is private: a token that can read packages, nothing more;
        # the same one lyl's pull uses, kept under its key
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" "hythm7" .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: lyl
