---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github
spec:
  type: github
  address: https://github.com/hythm-net/qube
  # GitHub App auth (novyxz): the same secret Flux uses to pull the repo.
  # A fine-grained PAT without the commit-status permission gets 404s here.
  secretRef:
    name: github-app-auth
