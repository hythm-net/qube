---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lyl
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: lyl-secret
    template:
      data:
        # mounted as files (/run/secrets/lyl), not env: each process reads only the one it needs
        ELEVENLABS_API_KEY: "{{ .ELEVENLABS_API_KEY }}"
        ARCHIVE_DEPLOY_KEY: "{{ .ARCHIVE_DEPLOY_KEY }}"
        # his Claude subscription (`claude setup-token`): the passes run on it, never on an API key
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: lyl
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lyl-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: lyl-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # the image is private: a token that can read packages, nothing more
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" "hythm7" .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: lyl
