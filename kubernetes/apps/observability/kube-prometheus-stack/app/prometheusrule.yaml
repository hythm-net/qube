---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-prometheus-stack-additional
spec:
  groups:
    - name: dockerhub.rules
      rules:
        - alert: DockerhubRateLimitRisk
          expr: |-
            count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          annotations:
            summary: >-
              There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
          labels:
            severity: critical

    - name: oom.rules
      rules:
        - alert: OomKilled
          expr: |-
            (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          annotations:
            summary: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          labels:
            severity: critical

    - name: memory.rules
      rules:
        # Requests come from measured peaks (#452). An app living well above its request is the
        # first to be evicted when the node runs short (the GPU can borrow 64 GiB of RAM), so this
        # says which app's resources.requests.memory to raise, before that happens. System
        # namespaces (Talos static pods, Flux) are outside that sizing.
        - alert: MemoryAboveRequest
          expr: |-
            (
              max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD", namespace!~"kube-system|flux-system"})
                / on (namespace, pod, container)
              max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="memory", namespace!~"kube-system|flux-system"})
              > 1.5
            )
            and on (namespace, pod, container)
            (
              max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})
                - on (namespace, pod, container)
              max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="memory"})
              > 128 * 1024 * 1024
            )
          for: 6h
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.container }} has used {{ $value | humanizePercentage }} of its
              memory request for 6 hours. Raise resources.requests.memory in its HelmRelease.
          labels:
            severity: warning

    - name: reboot.rules
      rules:
        # After an outage this tells a power cut (or crash) from a lost internet line. Talos
        # upgrades fire it too.
        - alert: NodeRebooted
          expr: |-
            (time() - max by (instance) (node_boot_time_seconds))
              * on (instance) group_left (nodename) max by (instance, nodename) (node_uname_info)
            < 900
          annotations:
            summary: >-
              {{ $labels.nodename }} booted {{ $value | humanizeDuration }} ago
          labels:
            severity: warning

        # Talos/tuppr upgrades can time out waiting for Ready after a good reboot and leave the
        # node cordoned; the stock node alerts all stay silent while a node is unschedulable.
        - alert: NodeCordoned
          expr: |-
            max by (node) (kube_node_spec_unschedulable) == 1
          for: 30m
          annotations:
            summary: >-
              {{ $labels.node }} has been cordoned for 30 minutes; new pods can't schedule.
              If no maintenance is running: kubectl uncordon {{ $labels.node }}
          labels:
            severity: warning
