---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Pocket ID
      client_id: grafana
      # client_secret: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from grafana-secret
      scopes: openid email profile groups
      auth_url: https://id.hythm.net/authorize
      token_url: https://id.hythm.net/api/oidc/token
      api_url: https://id.hythm.net/api/oidc/userinfo
      use_pkce: "true"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name
      # Pocket ID only lets the admins group in; they administer Grafana
      role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      allow_assign_grafana_admin: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.hythm.net
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              # the operator's defaults (256Mi/1Gi) sat under its 711Mi peak
              resources:
                requests:
                  cpu: 100m
                  memory: 896Mi
                limits:
                  memory: 2Gi
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    spec:
      hostnames:
        - grafana.hythm.net
      parentRefs:
        - name: envoy-internal
          namespace: networking
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: openebs-hostpath
  disableDefaultSecurityContext: All
