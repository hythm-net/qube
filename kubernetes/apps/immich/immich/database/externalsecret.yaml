---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: immich-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        # a fixed password, not one CNPG generates: Immich's dumps carry the role, so a restore
        # into a rebuilt cluster brings this same password back with it
        username: immich
        password: "{{ .POSTGRES_PASSWORD }}"
        uri: "postgresql://immich:{{ .POSTGRES_PASSWORD }}@immich-postgres-rw:5432/immich"
  dataFrom:
    - extract:
        key: immich
