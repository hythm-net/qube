---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The server faces the internet through envoy-direct. This says that nothing else in the
# cluster reaches it: the API only from that gateway, metrics only from Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/controller: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-direct
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
    # the kubelet's probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # its own namespace: the answers of Postgres, Valkey and machine learning come back through
    # their Services and, like CoreDNS's below, fall to the default deny otherwise (measured:
    # CONNECT_TIMEOUT to immich-postgres-rw:5432 the moment this policy applied)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: immich
    # CoreDNS's answers come back from the DNS service's address and would fall to the default
    # deny (measured on lyl: "Policy denied", kube-dns -> lyl, udp from 10.245.0.10:53)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
