---
# The same way in as ai/llama and drm-exporter: Jellyfin's claim holds the GPU exclusively, so
# Immich's server takes it with adminAccess (VAAPI for video transcoding only).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: immich
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            adminAccess: true
            allocationMode: All
