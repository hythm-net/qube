---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.0@sha256:2272b0fb7c8783a016bcc179abb467cfa34590c99c5e6560fe0e9155b4820a09
            env:
              TZ: America/New_York
              WEBUI_URL: https://chat.hythm.net
              PORT: &port 8080
              DATA_DIR: /app/backend/data
              HOME: /app/backend/data
              # the local model only: llama.cpp's OpenAI-compatible API (it ignores the key)
              ENABLE_OLLAMA_API: "false"
              OPENAI_API_BASE_URL: http://llama:8080/v1
              OPENAI_API_KEY: local
              # family accounts come from Pocket ID (family group only); no local sign-up. The
              # admin's local login stays as the way in when Pocket ID is down.
              ENABLE_SIGNUP: "false"
              DEFAULT_USER_ROLE: user
              # a model with no entry under Admin → Models is the admin's alone, so a family member
              # would find none: every account sees every model (there's one, and only family get in)
              BYPASS_MODEL_ACCESS_CONTROL: "true"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_CLIENT_ID: open-webui
              OPENID_PROVIDER_URL: https://id.hythm.net/.well-known/openid-configuration
              OAUTH_SCOPES: openid email profile
              # documents dropped into a chat are searched with a multilingual model (Arabic too)
              RAG_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
              ANONYMIZED_TELEMETRY: "false"
              DO_NOT_TRACK: "true"
              SCARF_NO_ANALYTICS: "true"
            envFrom:
              - secretRef:
                  name: open-webui-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                # the first start downloads the embedding model
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        # for the family away from home too: straight from the WAN, behind CrowdSec, DNS-only
        annotations:
          external-dns.kubernetes.io/cloudflare-proxied: "false"
        hostnames:
          - chat.hythm.net
        parentRefs:
          - name: envoy-direct
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
