---
# Jellyfin's claim holds the GPU exclusively and the AMD driver shares only partitioned
# Instinct GPUs, so this takes the same way in as drm-exporter: adminAccess (the namespace
# component labels every namespace for it). The scheduler does not count it; the GPU's
# memory (32 GiB VRAM + 64 GiB GTT, talos/schematic.yaml.j2) is what actually bounds it.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llama
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            adminAccess: true
            allocationMode: All
