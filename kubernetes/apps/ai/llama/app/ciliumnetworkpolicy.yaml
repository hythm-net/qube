---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The model answers Open WebUI and Paperless, nothing else in the cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llama
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: llama
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: open-webui
        - matchLabels:
            io.kubernetes.pod.namespace: paperless
            app.kubernetes.io/controller: paperless
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # the kubelet's probes
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # CoreDNS's answers come back from the DNS service's address (see immich-server's policy)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
