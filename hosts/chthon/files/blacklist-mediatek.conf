# chthon is wired only: no Wi-Fi or Bluetooth drivers, to save power. `blacklist` stops udev
# loading them; `install … /bin/false` also stops other modules pulling them in (btusb loaded
# btmtk despite its blacklist line).
blacklist mt7921e
blacklist btusb
blacklist btmtk
install mt7921e /bin/false
install btusb /bin/false
install btmtk /bin/false
