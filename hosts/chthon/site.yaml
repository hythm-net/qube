---
# chthon: the NAS. Everything configured by hand after an openSUSE Leap 16 install.
# Run: task hosts:chthon [CHECK=true]   (dry run with --check --diff)
- name: Configure chthon
  hosts: chthon
  become: true

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: sshd.service
        state: reloaded

    - name: Re-export NFS shares
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Unload the Bluetooth drivers
      ansible.builtin.command: modprobe -r btusb btmtk
      changed_when: true

    - name: Apply the Wi-Fi card's udev rule
      ansible.builtin.shell: >-
        udevadm control --reload &&
        udevadm trigger --action=add --subsystem-match=pci --attr-match=vendor=0x14c3
      changed_when: true

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reapply the network
      # nmcli only saves the profile; this makes the live interface match it (address,
      # gateway, DNS). An SSH session on an address that stays survives it.
      ansible.builtin.command: nmcli device reapply {{ lan.interface }}
      changed_when: true

    - name: Restart smartctl_exporter
      ansible.builtin.systemd_service:
        name: smartctl_exporter.service
        state: restarted
        daemon_reload: true

  tasks:
    - name: Base system
      tags: [base]
      block:
        - name: Hostname
          ansible.builtin.hostname:
            name: chthon
            use: systemd

        - name: Timezone
          community.general.timezone:
            name: "{{ timezone }}"

        - name: Packages
          community.general.zypper:
            name: "{{ packages }}"
            state: present

        # chthon is a wired-only NAS: nothing connects over Wi-Fi or Bluetooth, so the MediaTek
        # card's drivers stay unloaded and the card sleeps, to save power (the owner's choice,
        # 2026-02; the firmware settings have no switch for the card)
        - name: Keep the MediaTek Wi-Fi/Bluetooth drivers unloaded (wired only, saves power)
          ansible.builtin.copy:
            src: blacklist-mediatek.conf
            dest: /etc/modprobe.d/blacklist-mediatek.conf
            owner: root
            group: root
            mode: "0644"
          notify: Unload the Bluetooth drivers

        - name: Let the driverless Wi-Fi card sleep
          ansible.builtin.copy:
            src: 80-mediatek-wifi-sleep.rules
            dest: /etc/udev/rules.d/80-mediatek-wifi-sleep.rules
            owner: root
            group: root
            mode: "0644"
          notify: Apply the Wi-Fi card's udev rule

    - name: Network
      tags: [network]
      block:
        - name: Static address on necropolis
          community.general.nmcli:
            conn_name: "{{ lan.connection }}"
            ifname: "{{ lan.interface }}"
            type: ethernet
            method4: manual
            ip4: "{{ lan.address }}"
            gw4: "{{ lan.gateway }}"
            dns4: ["{{ lan.dns }}"]
            dns4_search: ["{{ lan.search }}"]
            method6: auto
            autoconnect: true
            state: present
          notify: Reapply the network

    - name: Users and access
      tags: [users]
      block:
        - name: Owner is in wheel
          ansible.builtin.user:
            name: "{{ owner }}"
            groups: wheel
            append: true

        - name: Automation account
          ansible.builtin.user:
            name: "{{ automation.user }}"
            shell: /bin/bash

        - name: Automation account key
          ansible.posix.authorized_key:
            user: "{{ automation.user }}"
            key: "{{ automation.key }}"

        - name: Automation account sudo
          ansible.builtin.copy:
            content: "{{ automation.user }} ALL=(ALL) NOPASSWD: ALL\n"
            dest: /etc/sudoers.d/{{ automation.user }}
            owner: root
            group: root
            mode: "0440"
            validate: visudo -cf %s

        - name: Root may log in with its password from the LAN and WireGuard only (disaster recovery)
          ansible.builtin.copy:
            src: 50-root-password-lan.conf
            dest: /etc/ssh/sshd_config.d/50-root-password-lan.conf
            owner: root
            group: root
            mode: "0644"
            validate: sshd -t -f %s
          notify: Reload sshd

    - name: Storage
      tags: [storage]
      block:
        - name: Mount the data subvolumes
          ansible.posix.mount:
            path: /data/{{ item.name }}
            src: UUID={{ data_uuid }}
            fstype: "{{ item.fstype | default('btrfs') }}"
            opts: "{{ item.opts }},{{ data_mount_opts }}"
            state: mounted
          loop: "{{ subvolumes }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Retired mounts
          ansible.posix.mount:
            path: "{{ item }}"
            state: absent
          loop: "{{ retired_mounts }}"

        - name: Subvolume roots
          ansible.builtin.file:
            path: /data/{{ item.name }}
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.owner }}"
            mode: "{{ item.mode }}"
          loop: "{{ subvolumes }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Directories the cluster writes to
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: directory
            owner: "{{ item.owner }}"
            group: "{{ item.owner }}"
            mode: "{{ item.mode }}"
          loop: "{{ data_dirs }}"
          loop_control:
            label: "{{ item.path }}"

    - name: NFS
      tags: [nfs]
      block:
        - name: Exports
          ansible.builtin.template:
            src: exports.j2
            dest: /etc/exports
            owner: root
            group: root
            mode: "0644"
          notify: Re-export NFS shares

    - name: Snapshots
      tags: [snapper]
      block:
        - name: Snapper configs
          ansible.builtin.command: snapper -c {{ item.name }} create-config {{ item.subvolume }}
          args:
            creates: /etc/snapper/configs/{{ item.name }}
          loop: "{{ snapper_configs }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Snapper retention
          ansible.builtin.lineinfile:
            path: /etc/snapper/configs/{{ item.0.name }}
            regexp: ^{{ item.1.key }}=
            line: '{{ item.1.key }}="{{ item.1.value }}"'
          loop: "{{ snapper_configs | product(snapper_settings | dict2items) | list }}"
          loop_control:
            label: "{{ item.0.name }} {{ item.1.key }}"

    - name: Monitoring
      tags: [monitoring]
      block:
        - name: Installed smartctl_exporter version
          ansible.builtin.command: /usr/local/bin/smartctl_exporter --version
          register: smartctl_exporter_installed
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Install smartctl_exporter {{ smartctl_exporter_version }}
          # --version prints to stderr
          when: smartctl_exporter_version | regex_replace('^v', '') not in (smartctl_exporter_installed.stdout + smartctl_exporter_installed.stderr)
          vars:
            release: smartctl_exporter-{{ smartctl_exporter_version | regex_replace('^v', '') }}.linux-amd64
            base_url: https://github.com/prometheus-community/smartctl_exporter/releases/download/{{ smartctl_exporter_version }}
          block:
            - name: Download the release
              ansible.builtin.get_url:
                url: "{{ base_url }}/{{ release }}.tar.gz"
                checksum: sha256:{{ base_url }}/sha256sums.txt
                dest: /tmp/{{ release }}.tar.gz
                mode: "0644"

            - name: Unpack the binary
              ansible.builtin.unarchive:
                src: /tmp/{{ release }}.tar.gz
                dest: /usr/local/bin
                remote_src: true
                extra_opts: [--strip-components=1, "{{ release }}/smartctl_exporter"]
              notify: Restart smartctl_exporter

        - name: smartctl_exporter binary
          ansible.builtin.file:
            path: /usr/local/bin/smartctl_exporter
            owner: root
            group: root
            mode: "0755"

        - name: smartctl_exporter unit (runs as root, smartctl reads raw disks)
          ansible.builtin.copy:
            src: smartctl_exporter.service
            dest: /etc/systemd/system/smartctl_exporter.service
            owner: root
            group: root
            mode: "0644"
          notify: Restart smartctl_exporter

    - name: Off-site backup (backpack)
      tags: [backpack]
      block:
        - name: Read the backpack credentials from Bitwarden (needs BWS_ACCESS_TOKEN)
          ansible.builtin.set_fact:
            backpack_secret: "{{ (lookup('ansible.builtin.pipe', 'bws secret list ' ~ bitwarden_projects.rune ~ ' -o json') | from_json | selectattr('key', 'equalto', 'backpack') | first).value | from_json }}"
            volsync_secret: "{{ (lookup('ansible.builtin.pipe', 'bws secret list ' ~ bitwarden_projects.qube ~ ' -o json') | from_json | selectattr('key', 'equalto', 'volsync_template') | first).value | from_json }}"
            mail_secret: "{{ (lookup('ansible.builtin.pipe', 'bws secret list ' ~ bitwarden_projects.rune ~ ' -o json') | from_json | selectattr('key', 'equalto', 'mail-backup') | first).value | from_json }}"
          no_log: true

        - name: Installed kopia version
          ansible.builtin.command: /usr/local/bin/kopia --version
          register: kopia_installed
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Install kopia {{ kopia_version }}
          when: kopia_version | regex_replace('^v', '') not in (kopia_installed.stdout | default(''))
          vars:
            release: kopia-{{ kopia_version | regex_replace('^v', '') }}-linux-x64
            base_url: https://github.com/kopia/kopia/releases/download/{{ kopia_version }}
          block:
            - name: Download kopia
              ansible.builtin.get_url:
                url: "{{ base_url }}/{{ release }}.tar.gz"
                checksum: sha256:{{ base_url }}/checksums.txt
                dest: /tmp/{{ release }}.tar.gz
                mode: "0644"

            - name: Unpack kopia
              when: not ansible_check_mode
              ansible.builtin.unarchive:
                src: /tmp/{{ release }}.tar.gz
                dest: /usr/local/bin
                remote_src: true
                extra_opts: [--strip-components=1, "{{ release }}/kopia"]

        - name: kopia binary
          when: not ansible_check_mode or kopia_installed.rc == 0
          ansible.builtin.file:
            path: /usr/local/bin/kopia
            owner: root
            group: root
            mode: "0755"

        - name: Credentials directory (root only)
          ansible.builtin.file:
            path: /etc/backpack
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Credentials (root only)
          ansible.builtin.template:
            src: backpack.env.j2
            dest: /etc/backpack/env
            owner: root
            group: root
            mode: "0600"
          no_log: true
          diff: false

        - name: Mail backup login (root only)
          ansible.builtin.template:
            src: mbsyncrc.j2
            dest: /etc/backpack/mbsyncrc
            owner: root
            group: root
            mode: "0600"
          no_log: true
          diff: false

        - name: Backup script
          ansible.builtin.copy:
            src: backpack.sh
            dest: /usr/local/libexec/backpack
            owner: root
            group: root
            mode: "0755"

        - name: Service
          ansible.builtin.copy:
            src: backpack.service
            dest: /etc/systemd/system/backpack.service
            owner: root
            group: root
            mode: "0644"
          notify: Reload systemd

        - name: Timer
          ansible.builtin.template:
            src: backpack.timer.j2
            dest: /etc/systemd/system/backpack.timer
            owner: root
            group: root
            mode: "0644"
          notify: Reload systemd

        - name: Timer enabled
          # on the first dry run the unit file is only simulated, so systemd can't know it yet
          ignore_errors: "{{ ansible_check_mode }}"
          ansible.builtin.systemd_service:
            name: backpack.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: Services
      tags: [services]
      block:
        - name: Enabled and running
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop: "{{ services + ['smartctl_exporter.service'] }}"
